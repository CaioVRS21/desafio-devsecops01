
name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'hotfix/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Não injete segredos diretamente no JavaScript do frontend.
      # Variáveis incorporadas ao bundle podem ser visualizadas pelos usuários.
      - name: 🔐 Verificar configuração de secrets
        run: |
          echo "Nenhum segredo será inserido no código-fonte."

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # Secrets Scanning com Gitleaks
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SAST com Semgrep
      - name: 🔍 SAST - Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config auto \
            --config p/xss \
            --error \
            src/

      # SCA com Grype
      - name: 📦 SCA - Grype
        run: |
          npm install --package-lock-only --no-audit --no-fund
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          grype dir:. --fail-on medium

      # Empacota o site em um artefato TAR
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference \
            --hard-dereference \
            --exclude=.git \
            --exclude=.github \
            -C src \
            -cvf artifact.tar \
            .

      # Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      # Instala o Cosign
      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # Assina o artefato usando assinatura keyless
      - name: ✍️ Assinar artefato
        run: |
          cosign sign-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --yes

      
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4.1.3
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # Confere a assinatura e a identidade do workflow que assinou
      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "Assinatura válida — artefato íntegro e autêntico."
      # Confere o hash do artefato
      - name: 🔢 Verificar hash do artefato
        run: sha256sum --check artifact.tar.sha256

      # Extrai somente após validar a assinatura
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4
